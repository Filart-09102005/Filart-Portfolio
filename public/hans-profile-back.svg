<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1440" viewBox="0 0 1024 1440" fill="none">
  <defs>
    <linearGradient id="bg" x1="110" y1="70" x2="914" y2="1370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20251f"/>
      <stop offset="1" stop-color="#121512"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8b99f"/>
      <stop offset="1" stop-color="#788c72"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1440" rx="46" fill="url(#bg)"/>
  <rect x="36" y="36" width="952" height="1368" rx="30" stroke="#a8b99f" stroke-opacity=".32" stroke-width="3"/>
  <circle cx="842" cy="196" r="100" stroke="#a8b99f" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="842" cy="196" r="65" stroke="#a8b99f" stroke-opacity=".12" stroke-width="2"/>
  <text x="104" y="145" fill="#a8b99f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="8">A LITTLE ABOUT ME</text>
  <text x="104" y="300" fill="#efefe8" font-family="Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="-5">Hans Filart</text>
  <text x="108" y="364" fill="#b8beb0" font-family="Arial, Helvetica, sans-serif" font-size="31" letter-spacing="3">BSIT STUDENT · FULL-STACK DEVELOPER</text>
  <path d="M106 438H916" stroke="url(#accent)" stroke-width="3"/>
  <text x="106" y="566" fill="#a8b99f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="5">WHAT I CARE ABOUT</text>
  <text x="106" y="660" fill="#efefe8" font-family="Georgia, 'Times New Roman', serif" font-size="46">Building useful things,</text>
  <text x="106" y="720" fill="#efefe8" font-family="Georgia, 'Times New Roman', serif" font-size="46">learning by doing, and</text>
  <text x="106" y="780" fill="#efefe8" font-family="Georgia, 'Times New Roman', serif" font-size="46">making technology feel</text>
  <text x="106" y="840" fill="#efefe8" font-family="Georgia, 'Times New Roman', serif" font-size="46">clear and thoughtful.</text>
  <text x="108" y="963" fill="#adb2a7" font-family="Arial, Helvetica, sans-serif" font-size="29">I build web and mobile systems, explore</text>
  <text x="108" y="1010" fill="#adb2a7" font-family="Arial, Helvetica, sans-serif" font-size="29">new ideas, and keep improving with every</text>
  <text x="108" y="1057" fill="#adb2a7" font-family="Arial, Helvetica, sans-serif" font-size="29">project and challenge.</text>
  <path d="M106 1168H916" stroke="#efefe8" stroke-opacity=".16" stroke-width="2"/>
  <text x="106" y="1244" fill="#a8b99f" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="5">PHILIPPINES</text>
  <text x="106" y="1318" fill="#81877d" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3">LEARN  /  DESIGN  /  BUILD  /  IMPROVE</text>
